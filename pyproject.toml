[project]
name = "data-analytics-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
